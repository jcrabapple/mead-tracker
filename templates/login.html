<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Mead Tracker</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/static/favicon.svg?v=1" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#161b22">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --honey: #d4a017;
            --honey-light: #f0d060;
        }
        html, body { height: 100%; }
        body {
            background: #0d1117;
            color: #c9d1d9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            padding-top: calc(1.25rem + env(safe-area-inset-top, 0px));
            padding-bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px));
        }
        .login-wrap { width: 100%; max-width: 360px; }
        .login-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 14px;
            padding: 1.75rem 1.5rem 1.5rem;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        }
        .login-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: var(--honey);
            font-weight: 700;
            font-size: 1.35rem;
            letter-spacing: -0.01em;
            margin-bottom: 0.35rem;
        }
        .login-brand img { border-radius: 8px; }
        .login-sub {
            text-align: center;
            color: #8b949e;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }
        .form-label {
            color: #8b949e;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .form-control {
            background: #0d1117;
            border-color: #30363d;
            color: #c9d1d9;
            padding: 0.6rem 0.75rem;
        }
        .form-control:focus {
            background: #0d1117;
            border-color: var(--honey);
            color: #c9d1d9;
            box-shadow: 0 0 0 0.2rem rgba(212, 160, 23, 0.15);
        }
        .btn-honey {
            background: var(--honey);
            color: #000;
            border: none;
            font-weight: 600;
            padding: 0.6rem 1rem;
        }
        .btn-honey:hover, .btn-honey:focus { background: var(--honey-light); color: #000; }
        .login-error {
            background: rgba(248, 81, 73, 0.12);
            border: 1px solid rgba(248, 81, 73, 0.4);
            color: #ff9f9a;
            border-radius: 8px;
            padding: 0.55rem 0.7rem;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-brand">
                <img src="/static/favicon.svg?v=1" alt="" width="30" height="30"> Mead Tracker
            </div>
            <div class="login-sub">Sign in to your batches</div>

            {% if error %}
            <div class="login-error" role="alert">{{ error }}</div>
            {% endif %}

            <form method="post" action="/login" autocomplete="on">
                <input type="hidden" name="next" value="{{ next }}">
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" class="form-control" id="username" name="username"
                           value="{{ username }}" autocomplete="username"
                           autocapitalize="none" autocorrect="off" spellcheck="false"
                           required {% if not username %}autofocus{% endif %}>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password"
                           autocomplete="current-password" required
                           {% if username %}autofocus{% endif %}>
                </div>
                <button type="submit" class="btn btn-honey w-100">
                    <i class="bi bi-box-arrow-in-right"></i> Sign in
                </button>
            </form>
        </div>
        <div class="text-center mt-3 small" style="color:#6e7681;">
            Stays signed in for {{ session_days }} days on this device.
        </div>
    </div>
</body>
</html>
